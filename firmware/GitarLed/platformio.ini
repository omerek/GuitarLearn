; PlatformIO ile derleme (bu klasörde):
;   ESP32-S2 Mini (yalnızca USB):        pio run -e lolin_s2_mini -t upload
;   ESP32-S3FH4R2 kartı (USB + Bluetooth): pio run -e esp32s3 -t upload
; Arduino IDE kullanacaksan GitarLed.ino dosyasını aç; README'deki ayarlara bak.
[platformio]
src_dir = .

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3

[env:lolin_s2_mini]
board = lolin_s2_mini
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3FH4R2: 4 MB flaş. Bluetooth kodu büyük olduğu için tek uygulama bölümü (huge_app) kullanılır.
[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
