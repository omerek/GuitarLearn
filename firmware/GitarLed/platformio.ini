; PlatformIO ile derleme (bu klasörde):
;   Arduino Nano (yalnızca USB):         pio run -e nano -t upload
;   ESP32-S2 Mini (yalnızca USB):        pio run -e lolin_s2_mini -t upload
;   ESP32-S3FH4R2 kartı (USB + Bluetooth): pio run -e esp32s3 -t upload
; Arduino IDE kullanacaksan GitarLed.ino dosyasını aç; README'deki ayarlara bak.
[platformio]
src_dir = .

[env]
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3

; S2 Mini: varsayılan bölüm tablosunda iki uygulama bölmesi var (uygulamadan güncelleme için)
[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3FH4R2: 4 MB flaş. Uygulamadan güncelleme için iki uygulama bölmesi gerekir:
; min_spiffs = 2 x 1,9 MB (Bluetooth'lu yazılım rahat sığar).
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Arduino Nano (ATmega328P). Mini USB'li klonlarda eski önyükleyici olur (nanoatmega328).
; Yükleme "not in sync" hatası verirse (yeni önyükleyicili kart) board = nanoatmega328new yap.
[env:nano]
platform = atmelavr
board = nanoatmega328
