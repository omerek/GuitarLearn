; PlatformIO ile derleme:  pio run -t upload   (bu klasörde)
; Arduino IDE kullanacaksan GitarLed.ino dosyasını aç; README'deki ayarlara bak.
[platformio]
src_dir = .

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
