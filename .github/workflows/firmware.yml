name: Gitar LED kartı yazılımı

on:
  push:
    branches: [ main ]
    paths: [ 'firmware/**', '.github/workflows/firmware.yml' ]
  pull_request:
    paths: [ 'firmware/**', '.github/workflows/firmware.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: PlatformIO kur
        run: pip install platformio
      - name: Derle (ESP32-S2 Mini ve ESP32-S3)
        run: pio run -d firmware/GitarLed
      - name: Derlenmiş dosyaları yükle
        uses: actions/upload-artifact@v4
        with:
          name: GitarLed-firmware
          path: firmware/GitarLed/.pio/build/*/firmware.bin
      - name: Telefondan indirilebilir sürüm yayınla (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp firmware/GitarLed/.pio/build/lolin_s2_mini/firmware.bin GitarLed-S2.bin
          cp firmware/GitarLed/.pio/build/esp32s3/firmware.bin GitarLed-S3.bin
          gh release delete kart-yazilimi --cleanup-tag -y || true
          gh release create kart-yazilimi GitarLed-S2.bin GitarLed-S3.bin \
            --target "$GITHUB_SHA" \
            --title "Gitar LED kartı yazılımı" \
            --notes "main dalından otomatik derlendi (${GITHUB_SHA::7}). Telefona indir, uygulamada Akorlar → LED → Kart yazılımı bölümünden yükle. S2 Mini için GitarLed-S2.bin, ESP32-S3 için GitarLed-S3.bin." \
            --prerelease
